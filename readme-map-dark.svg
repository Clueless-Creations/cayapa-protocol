<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
<title id="title">Messages between independent agents</title>
<desc id="desc">Direct 0.3 connects two independent hosts over HTTPS with a signed message and delivery outcome. Each owns its keys and state. Core 0.3 defines identity, authority, message and outcome. Durable conversation 0.2 adds optional shared history.</desc>
<rect x="1" y="1" width="718" height="378" rx="20" fill="#132624" stroke="#67867A"/>
<text x="30" y="33" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="2" fill="#9DE4CA">CAYAPA  /  PROTOCOL MAP</text>
<text x="30" y="74" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="35" font-weight="780" letter-spacing="0" fill="#F4F7EC">Messages cross hosts.</text>
<text x="30" y="100" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0" fill="#BBCFC5">Each host keeps its own keys and state.</text>
<rect x="555" y="43" width="135" height="31" rx="15" fill="#1C443A"/>
<text x="622" y="64" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1" fill="#9DE4CA">DIRECT / 0.3</text>
<rect x="30" y="121" width="165" height="114" rx="14" fill="#1C3531" stroke="#67867A"/>
<rect x="525" y="121" width="165" height="114" rx="14" fill="#1C3531" stroke="#67867A"/>
<text x="48" y="152" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.4" fill="#9DE4CA">HOST A</text>
<text x="48" y="184" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="25" font-weight="750" letter-spacing="0" fill="#F4F7EC">Sender</text>
<text x="48" y="210" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#BBCFC5">Owner delegation</text>
<text x="543" y="152" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.4" fill="#9DE4CA">HOST B</text>
<text x="543" y="184" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="25" font-weight="750" letter-spacing="0" fill="#F4F7EC">Recipient</text>
<text x="543" y="210" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#BBCFC5">Recipient admission</text>
<text x="360" y="150" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0" fill="#F4F7EC">Signed message</text>
<path d="M213 163 H506 M497 155 L506 163 L497 171" fill="none" stroke="#9DE4CA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="196" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0" fill="#F4F7EC">Delivery outcome</text>
<path d="M506 209 H213 M222 201 L213 209 L222 217" fill="none" stroke="#BBCFC5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="243" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-size="14" font-weight="750" letter-spacing="1.1" fill="#BBCFC5">HTTPS  ·  NO SHARED SERVICE REQUIRED</text>
<rect x="30" y="266" width="370" height="85" rx="12" fill="#213A35"/>
<rect x="413" y="266" width="277" height="85" rx="12" fill="#483924"/>
<text x="47" y="296" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.4" fill="#9DE4CA">CORE / 0.3</text>
<text x="47" y="324" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0" fill="#F4F7EC">Identity · Authority · Message · Outcome</text>
<text x="430" y="296" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="15" font-weight="750" letter-spacing="1.4" fill="#FFE0A3">DURABLE / 0.2</text>
<text x="430" y="324" text-anchor="start" font-family="system-ui, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="0" fill="#F4F7EC">Optional shared history</text>
</svg>
